[project]
name = "supertonic-training"
version = "0.1.0"
description = "SupertonicTTS Training Implementation - Zero-shot Text-to-Speech"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

dependencies = [
    # Deep Learning
    "torch>=2.2.0",
    "torchaudio>=2.2.0",

    # Audio Processing
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scipy>=1.12.0",

    # Utilities
    "einops>=0.7.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",

    # Training & Logging
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "tqdm>=4.66.0",

    # Data Processing
    "datasets>=2.16.0",
    "transformers>=4.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

export = [
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]

demo = [
    "gradio>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
